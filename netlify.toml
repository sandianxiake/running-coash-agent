# ============================================
# Netlify 配置文件
# ============================================

[build]
  command = "pnpm install && pnpm vite build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# 将 /api/* 请求重定向到 Netlify Functions
[[redirects]]
  from = "/api/coze-proxy"
  to = "/.netlify/functions/coze-proxy"
  status = 200
  force = true

# 设置 CORS 头
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
